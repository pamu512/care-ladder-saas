# Render blueprint: Care Ladder SaaS (Galuxium Nexus V2). Primary deploy
# target per plan Task 10 - web service + managed Postgres, HTTPS included.
# Deploy-day env (Stripe price IDs, webhook secret, Slack webhook) is set in
# the Render dashboard; only non-secret env lives here.
# STRIPE_WEBHOOK_SECRET is required on Render. Unsigned webhooks are rejected
# unless CARE_LADDER_ALLOW_UNSIGNED_WEBHOOKS=1 (local-only opt-in; do not set).
# CARE_LADDER_ENV=demo keeps stub checkout / reserved demo phones; it does not
# accept unsigned Stripe webhooks.
services:
  - type: web
    name: care-ladder-saas
    runtime: docker
    dockerfilePath: ./Dockerfile.saas
    plan: starter
    healthCheckPath: /demo/context
    envVars:
      - key: CARE_LADDER_ENV
        value: demo
      - key: CARE_LADDER_AUTH
        value: "on"
      - key: DATABASE_URL
        fromDatabase:
          name: care-ladder-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STRIPE_PRICE_HOME
        sync: false
      - key: STRIPE_PRICE_FACILITY
        sync: false
      - key: STRIPE_PRICE_FACILITY_GROWTH
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_MODE
        value: poll
      - key: TELEGRAM_HOOK_URL
        sync: false
      - key: FAMILY_PLAN_PATH
        sync: false

databases:
  - name: care-ladder-db
    plan: basic-256mb
