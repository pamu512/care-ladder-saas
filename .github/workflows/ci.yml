name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download person-detector model
        run: ./scripts/download_models.sh

      - name: Download eval clips (KU Leuven falls + negative control)
        run: ./scripts/download_clips.sh

      - name: Tests
        run: python -m pytest -v

      - name: Evaluation (labeled fixtures)
        run: |
          pip install boto3
          python scripts/evaluate.py --dnn --json eval-metrics.json

      - name: Eval metrics unchanged
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("eval-metrics.json"))
          assert m["cue_recall"] == 1.0, m
          assert m["false_escalation_rate"] == 0.0, m
          print("eval gate passed:", m["cue_recall"], m["false_escalation_rate"])
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # Fork isolation (plan Global Constraints): this CI never touches AWS.
      # Upstream opencv-care-ladder owns the ECR/ECS deploy of the live OpenCV stack.
      - name: Build SaaS image (Dockerfile.saas, no deploy)
        run: |
          echo "runner arch: $(uname -m)"
          docker build -f Dockerfile.saas --platform linux/amd64 -t care-ladder-saas:ci .
          ARCH=$(docker image inspect care-ladder-saas:ci --format '{{.Architecture}}')
          echo "image arch: $ARCH"
          if [ "$ARCH" != "amd64" ]; then
            echo "::error::image is $ARCH, expected amd64 (Render docker runtime) - refusing"
            exit 1
          fi
