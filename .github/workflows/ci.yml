name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download person-detector model
        run: ./scripts/download_models.sh

      - name: Download eval clips (KU Leuven falls + negative control)
        run: ./scripts/download_clips.sh

      - name: Tests
        run: python -m pytest -v

      - name: Evaluation (labeled fixtures)
        run: |
          pip install boto3
          python scripts/evaluate.py --dnn --json eval-metrics.json

      - name: Eval metrics unchanged
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("eval-metrics.json"))
          assert m["cue_recall"] == 1.0, m
          assert m["false_escalation_rate"] == 0.0, m
          print("eval gate passed:", m["cue_recall"], m["false_escalation_rate"])
          EOF

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (amd64; proves Dockerfile contract for ECS)
        run: |
          echo "runner arch: $(uname -m)"
          docker build --platform linux/amd64 -t care-ladder:ci .
          ARCH=$(docker image inspect care-ladder:ci --format '{{.Architecture}}')
          echo "image arch: $ARCH"
          if [ "$ARCH" != "amd64" ]; then
            echo "::error::image is $ARCH, expected amd64 — refusing to deploy"
            exit 1
          fi

      - name: Deploy to AWS (ECR push + ECS rolling redeploy)
        if: github.ref == 'refs/heads/main' && env.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CARE_LADDER_AWS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CARE_LADDER_AWS_SECRET }}
          AWS_REGION: us-east-1
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin 367597235216.dkr.ecr.us-east-1.amazonaws.com
          docker tag care-ladder:ci 367597235216.dkr.ecr.us-east-1.amazonaws.com/care-ladder:demo
          docker push 367597235216.dkr.ecr.us-east-1.amazonaws.com/care-ladder:demo
          aws ecs update-service --cluster care-ladder-demo --service care-ladder-demo --force-new-deployment
          echo "deploy triggered: image pushed to ECR :demo, ECS rolling restart initiated"
